<title>BPL Core Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a loan-file binder. Fixed index of 15 tabs on the left (modules + references), the open file on the right.
   Color: cool paper, ink, ledger green accent, amber for "draft" stamps, red for answers hidden. */
:root {
  --bg: #f5f7f6;
  --panel: #ffffff;
  --ink: #16201c;
  --muted: #5b6863;
  --rule: #d9e0dc;
  --accent: #1d6b57;
  --accent-soft: #e2efe9;
  --draft: #9a5b07;
  --draft-soft: #fbf0dc;
  --done: #1d6b57;
  --code-bg: #eef2f0;
  --shadow: 0 1px 2px rgb(22 32 28 / 6%), 0 4px 16px rgb(22 32 28 / 6%);
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --side: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --panel: #161e1b; --ink: #e3ebe7; --muted: #93a39c; --rule: #2a3632;
    --accent: #5fc2a4; --accent-soft: #1b2f29; --draft: #f0b45a; --draft-soft: #33270f; --done: #5fc2a4;
    --code-bg: #1d2723; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 16px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --panel: #161e1b; --ink: #e3ebe7; --muted: #93a39c; --rule: #2a3632;
  --accent: #5fc2a4; --accent-soft: #1b2f29; --draft: #f0b45a; --draft-soft: #33270f; --done: #5fc2a4;
  --code-bg: #1d2723; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 16px rgb(0 0 0 / 25%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--rule);
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: grid; gap: 2px; }
.brand b { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
.brand span { font-size: 0.78rem; color: var(--muted); }
.meter { display: grid; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.meter .bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.meter .sync { font-size: 0.74rem; }
.navlabel { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
nav ol, nav ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 1px; }
nav a {
  display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
  padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 0.88rem; line-height: 1.3;
}
nav a:hover { background: var(--accent-soft); }
nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
nav .code { font: 500 0.78rem var(--font-mono); color: var(--muted); }
nav .st { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--rule); align-self: center; }
nav .st[data-s="in-progress"] { border-color: var(--draft); background: linear-gradient(90deg, var(--draft) 50%, transparent 50%); }
nav .st[data-s="done"] { border-color: var(--done); background: var(--done); }
nav ul a { grid-template-columns: minmax(0, 1fr); }

main {
  min-width: 0; padding-block: 28px 80px;
  padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.doc { max-width: 52rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.label {
  font-size: 0.8rem; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); background: var(--panel);
  padding: 6px 10px; border-radius: 6px; justify-self: start;
}
.head { display: grid; gap: 8px; }
.eyebrow { font: 500 0.8rem var(--font-mono); color: var(--accent); letter-spacing: 0.04em; }
.head h1 { margin: 0; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.stamp {
  border: 1px solid var(--draft); background: var(--draft-soft); color: var(--ink);
  padding: 10px 14px; border-radius: 6px; font-size: 0.9rem;
}
.stamp b { color: var(--draft); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--rule); background: var(--panel); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.82rem; }
.toc a { text-decoration: none; border: 1px solid var(--rule); padding: 3px 9px; border-radius: 999px; color: var(--ink); background: var(--panel); }
.toc a:hover { border-color: var(--accent); }

.prose { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: clamp(16px, 3vw, 36px); min-width: 0; }
.prose > :first-child { margin-top: 0; }
.prose h1 { display: none; }
.prose h2 { font-size: 1.35rem; font-weight: 800; margin: 2.2em 0 .6em; padding-top: .8em; border-top: 1px solid var(--rule); letter-spacing: -0.01em; text-wrap: balance; scroll-margin-top: 16px; }
.prose h3 { font-size: 1.08rem; font-weight: 700; margin: 1.8em 0 .5em; text-wrap: balance; scroll-margin-top: 16px; }
.prose h4 { font-size: 1rem; margin: 1.4em 0 .4em; }
.prose p, .prose li { max-width: 68ch; overflow-wrap: anywhere; }
.prose ol, .prose ul { padding-left: 1.4em; }
.prose li { margin: .25em 0; }
.prose code { overflow-wrap: anywhere; word-break: break-word; font: 0.86em var(--font-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.prose pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
.prose pre code { background: none; padding: 0; }
.prose blockquote { margin: 1em 0; padding: .2em 1em; border-left: 3px solid var(--rule); color: var(--muted); }
.tbl { overflow-x: auto; margin: 1em 0; border: 1px solid var(--rule); border-radius: 6px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.tbl th { background: var(--code-bg); font-weight: 700; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }

.ref {
  font: 500 0.86em var(--font-mono); color: var(--accent); background: var(--accent-soft); border: 0; padding: 0 .3em;
  border-radius: 4px; cursor: pointer; white-space: nowrap;
}
.ref:hover { text-decoration: underline; }
details.key { border: 1px dashed var(--accent); border-radius: 6px; padding: 8px 14px; margin: 1em 0; background: var(--bg); }
details.key > summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.key[open] > summary { margin-bottom: .4em; }
.reveal { font-size: 0.8rem; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 999px; padding: 0 9px; cursor: pointer; margin-left: 4px; }

.notes { display: grid; gap: 8px; }
.notes label { font-weight: 700; }
.notes p { margin: 0; font-size: 0.85rem; color: var(--muted); }
.notes textarea {
  width: 100%; min-height: 9rem; resize: vertical; font: 0.95rem/1.5 var(--font-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px;
}
.notes .saved { font-size: 0.78rem; color: var(--muted); min-height: 1.2em; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--rule);
  box-shadow: var(--shadow); z-index: 20; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--rule); }
.drawer header b { font: 600 0.95rem var(--font-mono); color: var(--accent); }
.drawer .body { overflow-y: auto; padding: 4px 18px 24px; }
.drawer .body h3 { font-size: 1.05rem; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 10px; }
.card { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card .code { font: 500 0.78rem var(--font-mono); color: var(--accent); display: flex; justify-content: space-between; }
.card b { font-size: 0.95rem; line-height: 1.3; }
.card span { font-size: 0.8rem; color: var(--muted); }
.menu { display: none; }

/* ---- step view ---- */
.pill { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--panel); }
.pill[data-s="in-progress"] { color: var(--draft); border-color: var(--draft); background: var(--draft-soft); }
.pill[data-s="done"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps button {
  display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 0.84rem; font-weight: 600;
}
.steps button small { font: 500 0.72rem var(--font-mono); color: var(--muted); }
.steps button:hover { border-color: var(--accent); }
.steps button[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.steps button[aria-current="step"] small { color: inherit; opacity: .8; }
.stepbar { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); }
.stepbar .bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.stepbar .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn[disabled] { opacity: .45; cursor: default; }
.endcap { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.endcap .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.modnav { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 10px; }
.modnav a { display: grid; gap: 2px; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; text-decoration: none; color: var(--ink); background: var(--bg); }
.modnav a:hover { border-color: var(--accent); }
.modnav small { color: var(--muted); font-size: 0.78rem; }
.modnav .dir { font: 500 0.72rem var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.modnav a.next { text-align: right; }

/* ---- block frames ---- */
.prose .wx { background: var(--accent-soft); border: 1px solid var(--accent); border-left-width: 5px; border-radius: 8px; padding: 6px 16px 10px; margin: 1.4em 0; }
.prose .wx > :first-child { margin-top: .6em; }
.prose .wx .tbl { background: var(--panel); }
.prose p.callout { background: var(--draft-soft); border-left: 4px solid var(--draft); border-radius: 6px; padding: 10px 14px; margin: 1.2em 0; max-width: none; }
.prose .rubric { border: 2px solid var(--ink); border-radius: 8px; padding: 4px 16px 10px; margin: 1.2em 0; }
.prose .rubric > :first-child { margin-top: .6em; }
.prose .jobcard { border: 2px solid var(--ink); border-radius: 10px; padding: 8px 22px 18px; background: var(--bg); }
.prose .jobcard > h2 { border-top: 0; margin-top: .6em; padding-top: 0; }
.prose > h2:first-child, .prose .step > h2:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

/* ---- quiz and practice cards ---- */
.qset { display: grid; gap: 12px; margin: 1em 0; }
.score { position: sticky; top: 0; z-index: 2; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--muted); border-radius: 6px; padding: 8px 12px; font-size: 0.86rem; }
.score[data-v="pass"] { border-left-color: var(--accent); }
.score[data-v="fail"] { border-left-color: #b3261e; }
.score b { font-weight: 700; }
.qcard { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; background: var(--panel); }
.qcard[data-m="got"] { border-left: 4px solid var(--accent); }
.qcard[data-m="missed"] { border-left: 4px solid #b3261e; }
.qhead { display: flex; gap: 8px; align-items: center; }
.qnum { font: 600 0.8rem var(--font-mono); color: var(--accent); }
.crit { font-size: 0.7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #b3261e; border: 1px solid #b3261e; border-radius: 999px; padding: 0 8px; }
.qbody > :first-child { margin-top: 0; } .qbody > :last-child { margin-bottom: 0; }
.qbody p, .qbody ul { margin: .3em 0; }
.qbody ul { list-style: none; padding-left: .4em; }
.qcard textarea { width: 100%; min-height: 4.2rem; resize: vertical; font: 0.92rem/1.5 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.qacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qans { border-top: 1px dashed var(--accent); padding-top: 8px; display: grid; gap: 8px; }
.qans .ans-text { max-width: 68ch; overflow-wrap: anywhere; }
.btn.sm { padding: 4px 11px; font-size: 0.82rem; }
.btn.miss[aria-pressed="true"] { background: #b3261e; border-color: #b3261e; }
.qflag { font-size: 0.8rem; color: #b3261e; font-weight: 600; }

/* ---- chips, tags ---- */
.nb { white-space: nowrap; }
.tag { font-size: 0.7rem; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); background: var(--code-bg); border-radius: 4px; padding: 0 5px; white-space: nowrap; cursor: help; vertical-align: 1px; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }

/* ---- home dashboard ---- */
.cont { display: grid; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 16px 18px; }
.cont .eyebrow { font: 500 0.78rem var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.cont h2 { margin: 0; font-size: 1.3rem; line-height: 1.25; }
.cont p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.cont .btn { justify-self: start; margin-top: 6px; text-decoration: none; display: inline-block; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.plist a { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); text-decoration: none; color: var(--ink); font-size: 0.92rem; }
.plist a:hover { border-color: var(--accent); }
.plist .code { font: 500 0.78rem var(--font-mono); color: var(--accent); }
.plist small { color: var(--muted); display: block; font-size: 0.76rem; }
.howto h2 { margin-top: 0 !important; border-top: 0 !important; padding-top: 0 !important; }

/* ---- exercises, diagrams, listen ---- */
.steptools { display: flex; justify-content: flex-end; margin: 0 0 8px; }
.listen { display: inline-flex; gap: 6px; align-items: center; }
.listen-note { font-size: 0.8rem; color: var(--muted); margin-left: 10px; align-self: center; }
.exlist { display: grid; gap: 14px; margin-top: 1em; }
.exsum { font-size: 0.86rem; color: var(--muted); margin: 0; }
.ex { border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; gap: 12px; background: var(--panel); min-width: 0; }
.ex[data-done="1"] { border-left: 4px solid var(--accent); }
.ex h3 { margin: 0 !important; font-size: 1.05rem; }
.exhead { display: grid; gap: 6px; }
.exmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.78rem; }
.extype, .exdeal { font: 600 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
.exdeal { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); text-transform: none; }
.ex p { margin: 0; max-width: 68ch; overflow-wrap: anywhere; }
.exbody { display: grid; gap: 12px; min-width: 0; }
.exfields { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
.exfields legend { font-weight: 700; font-size: 0.85rem; padding: 0 6px; }
.exgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 10px; }
.exfield { display: grid; gap: 3px; min-width: 0; }
.exfield label, .exlab { font-size: 0.84rem; font-weight: 600; }
.exfield.chk { grid-template-columns: auto 1fr; align-items: center; justify-content: start; gap: 8px; }
.ex input[type="text"], .ex input[type="date"], .ex select, .ex textarea {
  width: 100%; font: 0.95rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; min-width: 0;
}
.ex textarea { min-height: 7rem; resize: vertical; font-family: var(--font-body); line-height: 1.5; }
.ex input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
.exrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.exres { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; display: grid; gap: 4px; }
.exres b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.exok { color: var(--accent); font-weight: 700; }
.exbad { color: #b3261e; font-weight: 700; }
.exnote { font-size: 0.84rem; color: var(--muted); }
.exlines { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.exline { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; background: var(--bg); }
.exline[data-ok="1"] { border-left: 4px solid var(--accent); }
.exline .exrow input { flex: 1 1 10rem; width: auto; }
.sortrow, .orderrow { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; display: grid; gap: 6px; background: var(--bg); }
.sortrow[data-r="right"], .orderrow[data-r="right"] { border-left: 4px solid var(--accent); }
.sortrow[data-r="wrong"], .orderrow[data-r="wrong"] { border-left: 4px solid #b3261e; }
.ex .btn[aria-pressed="true"].choice { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.orderlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: o; }
.orderrow { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.orderrow::before { counter-increment: o; content: counter(o); font: 600 0.8rem var(--font-mono); color: var(--accent); min-width: 1.4em; }
.orderrow .exrow { flex-wrap: nowrap; }
.dpath { margin: 0; padding-left: 1.2em; font-size: 0.84rem; color: var(--muted); }
.dopts { display: grid; gap: 6px; justify-items: start; }
.dend { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.dend b { font-size: 1.05rem; }
.rubric-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rubric-list label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.92rem; }
.rubric-list input { margin-top: .3em; }
.prose .exlines, .prose .orderlist, .prose .dpath { padding-left: 0; }
.prose .dpath { padding-left: 1.2em; }
.prose .exline, .prose .orderrow { margin: 0; }

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("course-data").textContent);
const LABEL = "Model policy for training - not for live lending decisions.";
const MODS = DATA.modules;               // [{key, code, title, hours, prereq, draft, md}]
const REFS = DATA.refs;                  // [{key, title, md}]
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const PASS = 0.8;

/* ---------- markdown ---------- */
marked.setOptions({ gfm: true, breaks: false });
function decorateTables(box) {
  for (const t of box.querySelectorAll("table")) {
    const w = el("div", "tbl"); t.replaceWith(w); w.appendChild(t);
    const heads = [...t.querySelectorAll("thead th")].map((h) => h.textContent.trim());
    const rows = [...t.querySelectorAll("tbody tr")];
    const ncol = heads.length || (rows[0] ? rows[0].children.length : 0);
    if (ncol >= 3) w.classList.add("stack");
    for (const tr of rows) [...tr.children].forEach((td, i) => { td.dataset.label = heads[i] || ""; });
    for (let c = 0; c < ncol; c++) {
      const cells = rows.map((r) => r.children[c]).filter(Boolean);
      const filled = cells.filter((td) => { const x = td.textContent.trim(); return x && !/^[—–-]$/.test(x); });
      const money = filled.filter((td) => /^[−-]?\$\s?[\d,]/.test(td.textContent.trim()));
      if (filled.length >= 2 && money.length / filled.length >= 0.6) {

}

  for (const h of box.querySelectorAll("h2, h3")) {

}

/* ---------- reference lookups (formula and rule IDs) ---------- */
const plainText = (s) => s.replace(/\*\*|`|\*/g, "").replace(/\s+/g, " ").trim();

}
const FORMULAS = new Map(), FNAMES = new Map();
{
  const lib = REFS.find((r) => r.key === "formulas").md;
  const parts = lib.split(/^(?=### F-[A-Z]+-\d+:)/m);
  for (const p of parts) {
    const m = /^### (F-[A-Z]+-\d+):\s*(.*)$/m.exec(p);
    if (m && p.startsWith("### " + m[1])) { FORMULAS.set(m[1], p.split(/^## /m)[0].trim()); FNAMES.set(m[1], plainText(m[2])); }
  }
}
const RULES = new Map(), RSUM = new Map();
{
  const lines = REFS.find((r) => r.key === "policy").md.split("\n");
  let header = null;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (!l.startsWith("|")) { header = null; continue; }
    if (header === null) { header = l; continue; }
    if (/^\|\s*-/.test(l)) continue;
    const m = /^\|\s*((?:CORE|RES|MF|COM)-[A-Z]+-\d+|D-[A-Z]+-\d+)\s*\|/.exec(l);
    if (m && !RULES.has(m[1])) {
      RULES.set(m[1], header + "\n" + header.replace(/[^|]+/g, " --- ") + "\n" + l);
      const cells = l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      RSUM.set(m[1], firstSentence(cells[1] || ""));
    }
  }
  // Rules defined as a bold heading line, e.g. "**Approval authority matrix (CORE-AUTH-01)**", then prose and a table.
  for (let i = 0; i < lines.length; i++) {
    const hm = /^\*\*([^*]*?)\s*\(((?:CORE|RES|MF|COM)-[A-Z]+-\d+)\)\*\*\s*$/.exec(lines[i]);
    if (!hm || RULES.has(hm[2])) continue;
    const block = []; let j = i + 1;
    while (j < lines.length && !/^(\*\*[^*]+\*\*\s*$|#{1,4}\s)/.test(lines[j])) { block.push(lines[j]); j++; }
    RULES.set(hm[2], `### ${hm[1]}\n\n` + block.join("\n").trim());
    const para = block.find((b) => b.trim() && !b.startsWith("|"));

}
const ID_RE = /\b(F-(?:CORE|RES|MF|COM)-\d{2}|(?:CORE|RES|MF|COM)-[A-Z]{2,5}-\d{2}|D-[A-Z]{2,5}-\d{2})\b/g;
const TAG_RE = /\[((?:VERIFY:|POLICY\b|CONFIRM\b)[^\]]*)\]/g;
function chipTitle(id) {
  if (FNAMES.has(id)) return `${id}: ${FNAMES.get(id)}`;
  if (RSUM.has(id)) return `${id}: ${RSUM.get(id)}`;
  return id;
}
function tagBadge(text) {
  const b = el("span", "tag");
  const kind = /^VERIFY/.test(text) ? "Source" : /^POLICY/.test(text) ? "Policy note" : "To confirm";
  let short = kind;
  if (kind === "Source") { const src = text.replace(/^VERIFY:\s*/, "").split(";")[0].trim(); short = "Source: " + (src.length > 34 ? src.slice(0, 33) + "…" : src); }
  b.textContent = short; b.title = `[${text}]`;

}
function textNodes(root) {

    acceptNode: (n) => n.parentElement.closest("a, button, .ref, .tag, pre, textarea, .mermaid-diagram") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,

}

  for (const n of textNodes(root)) {
    const s = n.nodeValue; ID_RE.lastIndex = 0;

      let before = s.slice(last, m.index), lead = "";

      b.setAttribute("aria-label", `Look up ${id}`);

}

  $("drawer-title").textContent = id;
  const body = $("drawer-body"); body.replaceChildren(render(md));
  const note = el("p", "label", LABEL); body.prepend(note);

$("drawer-close").addEventListener("click", () => { $("drawer").hidden = true; });

/* ---------- hide answers until asked ---------- */
const KEY_RE = /^(answer key|model answer)/i;
const startsBold = (n) => n && n.tagName === "P" && n.firstElementChild && n.firstElementChild.tagName === "STRONG" && n.firstChild === n.firstElementChild;
const isKeyLabel = (n) => startsBold(n) && KEY_RE.test(n.firstElementChild.textContent.trim());
function hideAnswers(root) {
  // Blocks: a paragraph that opens with a bold "Answer key…" or "Model answer…" label, plus what follows it,
  // up to the next heading, rule or bold-labelled paragraph.
  for (const p of [...root.querySelectorAll("p")]) {
    if (!isKeyLabel(p) || !p.parentNode) continue;
    const first = p.firstElementChild;
    const d = el("details", "key");
    const label = first.textContent.replace(/[.:]\s*$/, "");
    d.append(el("summary", "", "Show " + label.charAt(0).toLowerCase() + label.slice(1))); p.before(d);
    let n = p;
    while (n) {
      const next = n.nextElementSibling;
      d.append(n);
      if (!next || /^(H[1-4]|HR|DETAILS)$/.test(next.tagName) || startsBold(next)) break;
      n = next;
    }
  }
  // Inline: "**Answer:** …" inside a list item or paragraph.
  for (const s of [...root.querySelectorAll("strong")]) {
    if (!/^answer:?$/i.test(s.textContent.trim()) || s.closest("details.key, .qans")) continue;
    const span = el("span", "ans"); span.hidden = true;
    const b = el("button", "reveal", "Show answer"); b.type = "button";
    b.addEventListener("click", () => { span.hidden = !span.hidden; b.textContent = span.hidden ? "Show answer" : "Hide answer"; });
    s.before(b);

/* ---------- block frames keyed on bold labels ---------- */
function grab(p, cls) {
  const d = el("div", cls); p.before(d);
  let n = p;
  while (n) {
    const next = n.nextElementSibling;
    d.append(n);
    if (!next || /^(H[1-6]|HR|DETAILS)$/.test(next.tagName) || startsBold(next)) break;
    n = next;

}
function frameBlocks(root) {
  for (const p of [...root.querySelectorAll("p")]) {

    const t = p.firstElementChild.textContent.trim();

/* ---------- progress store: db per person, browser fallback ---------- */
const state = { status: {}, ready: false };
let view = "home";
const store = {
  db: null, uid: null, mode: "local", chain: Promise.resolve(),
  localGet(k) { try { return JSON.parse(localStorage.getItem("bpl:" + k)); } catch { return null; } },
  localSet(k, v) { try { localStorage.setItem("bpl:" + k, JSON.stringify(v)); } catch { /* storage blocked */ } },
  write(path, body) {
    // One write at a time per document, in order.
    this.chain = this.chain.then(() => this.db.doc(path).set(body)).catch((e) => setSync(`Couldn't save (${e && e.code || "error"}). Your change shows here but may not be kept.`));
    return this.chain;
  },
  saveStatus() {
    if (this.mode === "db") return this.write(`data/users/${this.uid}/progress`, { status: state.status, updatedAt: new Date().toISOString() });
    this.localSet("status", state.status);
  },
  async loadNote(key) {
    if (this.mode === "db") {
      try { const s = await this.db.doc(`data/users/${this.uid}/note-${key}`).get(); return s.exists ? String(s.data().text || "") : ""; }

  saveNote(key, text) {

    return Promise.resolve();
  },
  async loadQuiz(key) {

    if (this.mode === "db") {
      try { const s = await this.db.doc(`data/users/${this.uid}/quiz-${key}`).get(); v = s.exists ? s.data() : null; } catch { v = null; }
    } else v = this.localGet("quiz-" + key);
    return { answers: { ...(v && v.answers) }, marks: { ...(v && v.marks) }, practice: { ...(v && v.practice) }, exercises: { ...(v && v.exercises) } };
  },

    const body = { answers: qs.answers, marks: qs.marks, practice: qs.practice, exercises: qs.exercises || {} };
    if (this.mode === "db") return this.write(`data/users/${this.uid}/quiz-${key}`, { ...body, updatedAt: new Date().toISOString() });

function setSync(t) { $("sync").textContent = t; }
async function initStore() {
  state.status = store.localGet("status") || {};
  paintProgress();
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch { /* not in a viewer */ }
  const uid = user ? await user.id() : null;
  if (!db || !uid) { setSync("Progress is saved in this browser only."); state.ready = true; return; }
  store.db = db; store.uid = uid; store.mode = "db";
  const timer = setTimeout(() => setSync("Can't reach your saved progress yet. Showing what this browser has."), 10000);
  db.doc(`data/users/${uid}/progress`).onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync("Progress saved to your account."); }
    if (snap.exists) state.status = { ...(snap.data().status || {}) };
    state.ready = true; paintProgress();
    const key = location.hash.slice(1) || "home";
    if (!MODS.some((x) => x.key === key) && !REFS.some((x) => x.key === key)) showHome();

function setStatus(key, s) { state.status = { ...state.status, [key]: s }; paintProgress(); store.saveStatus(); }
const STATUS_TEXT = { "not-started": "Not started", "in-progress": "In progress", "done": "Done" };

/* ---------- views ---------- */
function paintProgress() {
  let done = 0, hours = 0, total = 0;
  for (const m of MODS) {
    total += m.hours;
    const s = state.status[m.key] || "not-started";
    if (s === "done") { done++; hours += m.hours; }
    const dot = document.querySelector(`#nav-modules [data-key="${m.key}"] .st`);
    if (dot) { dot.dataset.s = s; dot.title = STATUS_TEXT[s] || s; }
  }
  $("meter-text").textContent = `${done} of ${MODS.length} modules done · ${hours} of ${total} hours`;
  $("meter-bar").style.width = `${(hours / total) * 100}%`;
  const pill = document.getElementById("pill");
  if (pill) { const s = state.status[pill.dataset.for] || "not-started"; pill.dataset.s = s; pill.textContent = STATUS_TEXT[s]; }
  const btn = document.getElementById("donebtn");
  if (btn) { const d = (state.status[btn.dataset.for] || "") === "done"; btn.textContent = d ? "Module done. Undo" : "Mark module done"; btn.setAttribute("aria-pressed", String(d)); btn.classList.toggle("primary", !d); }
}

    a.href = "#" + r.key; a.dataset.key = r.key; a.textContent = r.title; li.append(a); ul.append(li);
  }
}

let flushers = [];

<li>Work the modules in order. Each is a short series of steps: Overview, Learn, Exercises (where a module has them), Practice, Quiz, OJT task, Job aid and Wrap-up.</li>

function buildQuiz(sec, qs, saver) {
  const groups = []; let cur = null;

      const st = [...li.querySelectorAll("strong")].find((s) => /^answer:?$/i.test(s.textContent.trim()) && s.parentNode === li);
      if (st) {
        const tmp = el("div"); let n = st.nextSibling;
        while (n) { const nx = n.nextSibling; tmp.append(n); n = nx; }
        st.remove(); ansHtml = tmp.innerHTML.trim();
      } else if (keyOl && keyOl.children[i]) ansHtml = keyOl.children[i].innerHTML;
      const body = el("div", "qbody");
      while (li.firstChild) body.append(li.firstChild);
      const crit = takeCritical(body);
      const card = el("article", "qcard"); card.dataset.id = id; if (crit) card.dataset.critical = "1";
      const head = el("div", "qhead"); head.append(el("span", "qnum", `Set ${setId} · Q${i + 1}`));
      if (crit) head.append(el("span", "crit", "Critical"));
      const ta = answerBox(`Your answer to Set ${setId} question ${i + 1}`, qs.answers[id], (v) => { qs.answers[id] = v; saver.touch(); }, "Your answer and working");
      const acts = el("div", "qacts");
      const rev = el("button", "btn sm", "Reveal answer"); rev.type = "button";
      acts.append(rev);
      const ans = el("div", "qans"); ans.hidden = true;
      const at = el("div", "ans-text"); at.innerHTML = ansHtml || "<em>No answer is listed for this item.</em>";

        got.classList.toggle("primary", mk === "got");

      rev.addEventListener("click", () => { ans.hidden = !ans.hidden; rev.textContent = ans.hidden ? "Reveal answer" : "Hide answer"; });
      const setMark = (v) => { qs.marks[id] = qs.marks[id] === v ? "" : v; if (!qs.marks[id]) delete qs.marks[id]; paint(); saver.touch(); updateScore(); };
      got.addEventListener("click", () => setMark("got")); miss.addEventListener("click", () => setMark("missed"));
      card.append(head, body, ta, acts, ans);

      const total = cards.length, need = Math.ceil(PASS * total - 1e-9);
      const got = cards.filter((c) => qs.marks[c.id] === "got").length;
      const marked = cards.filter((c) => qs.marks[c.id]).length;
      const missedCrit = cards.filter((c) => c.crit && qs.marks[c.id] === "missed").map((c) => c.id.replace(setId, "Q"));

      if (missedCrit.length) { v = "fail"; msg = ` Critical item missed (${missedCrit.join(", ")}): this set is not passed.`; }

    }

  }
}
function buildPractice(sec, qs, saver) {
  for (const n of [...sec.children]) {
    if (isKeyLabel(n)) break;

    const wrap = el("div", "qset");
    [...n.children].filter((x) => x.tagName === "LI").forEach((li, i) => {

const TYPE_LABEL = { calculator: "Calculator", buildup: "Build-up", sort: "Sort", order: "Put in order", decision: "Decision path", scenario: "Scenario" };
const HALF = { money: 0.005, pct1: 0.0005, pct2: 0.00005, ratioX: 0.005, fixed6: 0.0000005, days: 0.5, months1: 0.05, text: 0 };

function prepareDiagrams(root) {

const themeKey = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mermaidTheme = null, diagramBusy = Promise.resolve();
function initMermaid() {

  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", logLevel: 5, theme: "base",
    themeVariables: {

      textColor: cssVar("--ink"), nodeBorder: cssVar("--accent"), clusterBkg: cssVar("--code-bg"), edgeLabelBackground: cssVar("--panel"),

function diagramFallback(box) {

function renderDiagrams(scope) {
  const boxes = [...scope.querySelectorAll(".mermaid-diagram")];
  if (!boxes.length) return;
  diagramBusy = diagramBusy.then(async () => {
    for (const box of boxes) {

      if (typeof mermaid === "undefined") { diagramFallback(box); continue; }

      } catch { if (box.isConnected) diagramFallback(box); }

}

/* ---------- narration ---------- */
const BLOCK_SEL = "h1, h2, h3, h4, p, li, blockquote, .speak, table";
const NESTED = new Set(["UL", "OL", "LI", "P", "BLOCKQUOTE", "TABLE", "PRE", "DIV", "DETAILS", "FIGURE", "ARTICLE", "SECTION", "FIELDSET", "H1", "H2", "H3", "H4", "H5", "H6"]);
const hiddenNode = (e) => !!e.closest("[hidden], details:not([open]) > :not(summary), .mermaid-diagram, .tag, .steptools");
function ownSpeech(e) {
  let s = "";
  for (const n of e.childNodes) {
    if (n.nodeType === 3) s += n.nodeValue;
    else if (n.nodeType === 1) {
      if (NESTED.has(n.tagName) || n.hidden || n.classList.contains("tag")) continue;
      if (["BUTTON", "INPUT", "TEXTAREA", "SELECT", "SUMMARY", "SCRIPT", "STYLE"].includes(n.tagName) && !n.classList.contains("ref")) continue;
      s += ownSpeech(n);
    }
  }
  return s;
}
function speechLines(root) {
  const lines = [];
  for (const e of root.querySelectorAll(BLOCK_SEL)) {
    if (hiddenNode(e)) continue;
    if (e.tagName === "TABLE") { lines.push("There is a table here. Read it on the screen."); continue; }
    if (e.closest("table, pre")) continue;
    const t = ownSpeech(e).replace(/\s+/g, " ").trim();
    if (t) lines.push(t);
  }
  const out = [];
  for (const l of lines) {
    if (l.length < 2000) { out.push(l); continue; }
    let cur = "";
    for (const sentence of l.split(/(?<=[.!?])\s+/)) {
      if ((cur + " " + sentence).length >= 1900) { if (cur) out.push(cur); cur = sentence.slice(0, 1900); } else cur = cur ? cur + " " + sentence : sentence;
    }
    if (cur) out.push(cur);
  }
  return out;
}
const tts = { api: null, speaking: false };
function hideListen() { for (const b of document.querySelectorAll(".steptools")) b.hidden = true; }
async function stopListening() {

}
function listenTools(getSec) {

  const b = el("button", "btn sm listen", "Listen"); b.type = "button";
  const note = el("span", "listen-note"); note.setAttribute("role", "status");

async function showModule(m) {
  view = "module";

  const idx = MODS.indexOf(m);

  const steps = splitSteps(box);
  const saver = makeSaver(qs, m.key);

    const at = steps.findIndex((x) => x.id === "learn");
    steps.splice(at + 1, 0, { id: "exercises", label: "Exercises", sec: buildExercises(m, qs, saver) });
  }

  (steps.find((s) => s.id === "ojt") || steps[steps.length - 1]).sec.append(notes);

  ta.value = noteText; ta.placeholder = "Your answers, calculations and OJT notes for " + m.code;

  done.addEventListener("click", () => setStatus(m.key, (state.status[m.key] || "") === "done" ? "in-progress" : "done"));
  row.append(done, el("span", "", "Finished the quiz, the OJT task and the self-check? Mark this module done."));

  const stage = el("div", "stage");

  const back = el("button", "btn", "Back"), nextB = el("button", "btn primary", "Next"); back.type = nextB.type = "button";
  pager.append(back, nextB);
