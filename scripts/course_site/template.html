<title>BPL Core Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a loan-file binder. Fixed index of 15 tabs on the left (modules + references), the open file on the right.
   Color: cool paper, ink, ledger green accent, amber for "draft" stamps, red for answers hidden. */
:root {
  --bg: #f5f7f6;
  --panel: #ffffff;
  --ink: #16201c;
  --muted: #5b6863;
  --rule: #d9e0dc;
  --accent: #1d6b57;
  --accent-soft: #e2efe9;
  --draft: #9a5b07;
  --draft-soft: #fbf0dc;
  --done: #1d6b57;
  --code-bg: #eef2f0;
  --shadow: 0 1px 2px rgb(22 32 28 / 6%), 0 4px 16px rgb(22 32 28 / 6%);
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --side: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --panel: #161e1b; --ink: #e3ebe7; --muted: #93a39c; --rule: #2a3632;
    --accent: #5fc2a4; --accent-soft: #1b2f29; --draft: #f0b45a; --draft-soft: #33270f; --done: #5fc2a4;
    --code-bg: #1d2723; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 16px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --panel: #161e1b; --ink: #e3ebe7; --muted: #93a39c; --rule: #2a3632;
  --accent: #5fc2a4; --accent-soft: #1b2f29; --draft: #f0b45a; --draft-soft: #33270f; --done: #5fc2a4;
  --code-bg: #1d2723; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 16px rgb(0 0 0 / 25%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--rule);
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: grid; gap: 2px; }
.brand b { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
.brand span { font-size: 0.78rem; color: var(--muted); }
.meter { display: grid; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.meter .bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.meter .sync { font-size: 0.74rem; }
.navlabel { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
nav ol, nav ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 1px; }
nav a {
  display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
  padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 0.88rem; line-height: 1.3;
}
nav a:hover { background: var(--accent-soft); }
nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
nav .code { font: 500 0.78rem var(--font-mono); color: var(--muted); }
nav .st { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--rule); align-self: center; }
nav .st[data-s="in-progress"] { border-color: var(--draft); background: linear-gradient(90deg, var(--draft) 50%, transparent 50%); }
nav .st[data-s="done"] { border-color: var(--done); background: var(--done); }
nav ul a { grid-template-columns: minmax(0, 1fr); }

main {
  min-width: 0; padding-block: 28px 80px;
  padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.doc { max-width: 52rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.label {
  font-size: 0.8rem; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); background: var(--panel);
  padding: 6px 10px; border-radius: 6px; justify-self: start;
}
.head { display: grid; gap: 8px; }
.eyebrow { font: 500 0.8rem var(--font-mono); color: var(--accent); letter-spacing: 0.04em; }
.head h1 { margin: 0; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.stamp {
  border: 1px solid var(--draft); background: var(--draft-soft); color: var(--ink);
  padding: 10px 14px; border-radius: 6px; font-size: 0.9rem;
}
.stamp b { color: var(--draft); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--rule); background: var(--panel); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.82rem; }
.toc a { text-decoration: none; border: 1px solid var(--rule); padding: 3px 9px; border-radius: 999px; color: var(--ink); background: var(--panel); }
.toc a:hover { border-color: var(--accent); }

.prose { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: clamp(16px, 3vw, 36px); min-width: 0; }
.prose > :first-child { margin-top: 0; }
.prose h1 { display: none; }
.prose h2 { font-size: 1.35rem; font-weight: 800; margin: 2.2em 0 .6em; padding-top: .8em; border-top: 1px solid var(--rule); letter-spacing: -0.01em; text-wrap: balance; scroll-margin-top: 16px; }
.prose h3 { font-size: 1.08rem; font-weight: 700; margin: 1.8em 0 .5em; text-wrap: balance; scroll-margin-top: 16px; }
.prose h4 { font-size: 1rem; margin: 1.4em 0 .4em; }
.prose p, .prose li { max-width: 68ch; overflow-wrap: anywhere; }
.prose ol, .prose ul { padding-left: 1.4em; }
.prose li { margin: .25em 0; }
.prose code { overflow-wrap: anywhere; word-break: break-word; font: 0.86em var(--font-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.prose pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
.prose pre code { background: none; padding: 0; }
.prose blockquote { margin: 1em 0; padding: .2em 1em; border-left: 3px solid var(--rule); color: var(--muted); }
.tbl { overflow-x: auto; margin: 1em 0; border: 1px solid var(--rule); border-radius: 6px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.tbl th { background: var(--code-bg); font-weight: 700; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }

.ref {
  font: 500 0.86em var(--font-mono); color: var(--accent); background: var(--accent-soft); border: 0; padding: 0 .3em;
  border-radius: 4px; cursor: pointer; white-space: nowrap;
}
.ref:hover { text-decoration: underline; }
details.key { border: 1px dashed var(--accent); border-radius: 6px; padding: 8px 14px; margin: 1em 0; background: var(--bg); }
details.key > summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.key[open] > summary { margin-bottom: .4em; }
.reveal { font-size: 0.8rem; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 999px; padding: 0 9px; cursor: pointer; margin-left: 4px; }

.notes { display: grid; gap: 8px; }
.notes label { font-weight: 700; }
.notes p { margin: 0; font-size: 0.85rem; color: var(--muted); }
.notes textarea {
  width: 100%; min-height: 9rem; resize: vertical; font: 0.95rem/1.5 var(--font-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px;
}
.notes .saved { font-size: 0.78rem; color: var(--muted); min-height: 1.2em; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--rule);
  box-shadow: var(--shadow); z-index: 20; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--rule); }
.drawer header b { font: 600 0.95rem var(--font-mono); color: var(--accent); }
.drawer .body { overflow-y: auto; padding: 4px 18px 24px; }
.drawer .body h3 { font-size: 1.05rem; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 10px; }
.card { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card .code { font: 500 0.78rem var(--font-mono); color: var(--accent); display: flex; justify-content: space-between; }
.card b { font-size: 0.95rem; line-height: 1.3; }
.card span { font-size: 0.8rem; color: var(--muted); }
.menu { display: none; }

/* ---- step view ---- */
.pill { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--panel); }
.pill[data-s="in-progress"] { color: var(--draft); border-color: var(--draft); background: var(--draft-soft); }
.pill[data-s="done"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps button {
  display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 0.84rem; font-weight: 600;
}
.steps button small { font: 500 0.72rem var(--font-mono); color: var(--muted); }
.steps button:hover { border-color: var(--accent); }
.steps button[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.steps button[aria-current="step"] small { color: inherit; opacity: .8; }
.stepbar { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); }
.stepbar .bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.stepbar .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn[disabled] { opacity: .45; cursor: default; }
.endcap { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.endcap .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.modnav { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 10px; }
.modnav a { display: grid; gap: 2px; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; text-decoration: none; color: var(--ink); background: var(--bg); }
.modnav a:hover { border-color: var(--accent); }
.modnav small { color: var(--muted); font-size: 0.78rem; }
.modnav .dir { font: 500 0.72rem var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.modnav a.next { text-align: right; }

/* ---- block frames ---- */
.prose .wx { background: var(--accent-soft); border: 1px solid var(--accent); border-left-width: 5px; border-radius: 8px; padding: 6px 16px 10px; margin: 1.4em 0; }
.prose .wx > :first-child { margin-top: .6em; }
.prose .wx .tbl { background: var(--panel); }
.prose p.callout { background: var(--draft-soft); border-left: 4px solid var(--draft); border-radius: 6px; padding: 10px 14px; margin: 1.2em 0; max-width: none; }
.prose .rubric { border: 2px solid var(--ink); border-radius: 8px; padding: 4px 16px 10px; margin: 1.2em 0; }
.prose .rubric > :first-child { margin-top: .6em; }
.prose .jobcard { border: 2px solid var(--ink); border-radius: 10px; padding: 8px 22px 18px; background: var(--bg); }
.prose .jobcard > h2 { border-top: 0; margin-top: .6em; padding-top: 0; }
.prose > h2:first-child, .prose .step > h2:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

/* ---- quiz and practice cards ---- */
.qset { display: grid; gap: 12px; margin: 1em 0; }
.score { position: sticky; top: 0; z-index: 2; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--muted); border-radius: 6px; padding: 8px 12px; font-size: 0.86rem; }
.score[data-v="pass"] { border-left-color: var(--accent); }
.score[data-v="fail"] { border-left-color: #b3261e; }
.score b { font-weight: 700; }
.qcard { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; background: var(--panel); }
.qcard[data-m="got"] { border-left: 4px solid var(--accent); }
.qcard[data-m="missed"] { border-left: 4px solid #b3261e; }
.qhead { display: flex; gap: 8px; align-items: center; }
.qnum { font: 600 0.8rem var(--font-mono); color: var(--accent); }
.crit { font-size: 0.7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #b3261e; border: 1px solid #b3261e; border-radius: 999px; padding: 0 8px; }
.qbody > :first-child { margin-top: 0; } .qbody > :last-child { margin-bottom: 0; }
.qbody p, .qbody ul { margin: .3em 0; }
.qbody ul { list-style: none; padding-left: .4em; }
.qcard textarea { width: 100%; min-height: 4.2rem; resize: vertical; font: 0.92rem/1.5 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.qacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qans { border-top: 1px dashed var(--accent); padding-top: 8px; display: grid; gap: 8px; }
.qans .ans-text { max-width: 68ch; overflow-wrap: anywhere; }
.btn.sm { padding: 4px 11px; font-size: 0.82rem; }
.btn.miss[aria-pressed="true"] { background: #b3261e; border-color: #b3261e; }
.qflag { font-size: 0.8rem; color: #b3261e; font-weight: 600; }

/* ---- chips, tags ---- */
.nb { white-space: nowrap; }
.tag { font-size: 0.7rem; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); background: var(--code-bg); border-radius: 4px; padding: 0 5px; white-space: nowrap; cursor: help; vertical-align: 1px; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }

/* ---- home dashboard ---- */
.cont { display: grid; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 16px 18px; }
.cont .eyebrow { font: 500 0.78rem var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.cont h2 { margin: 0; font-size: 1.3rem; line-height: 1.25; }
.cont p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.cont .btn { justify-self: start; margin-top: 6px; text-decoration: none; display: inline-block; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.plist a { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); text-decoration: none; color: var(--ink); font-size: 0.92rem; }
.plist a:hover { border-color: var(--accent); }
.plist .code { font: 500 0.78rem var(--font-mono); color: var(--accent); }
.plist small { color: var(--muted); display: block; font-size: 0.76rem; }
.howto h2 { margin-top: 0 !important; border-top: 0 !important; padding-top: 0 !important; }

@media (max-width: 599px) {
  .tbl.stack { border: 0; overflow: visible; }
  .tbl.stack table, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td { display: block; width: 100%; }
  .tbl.stack thead { display: none; }
  .tbl.stack tr { border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 8px; background: var(--panel); padding: 4px 0; }
  .tbl.stack td { border: 0; padding: 3px 12px; text-align: left !important; display: grid; grid-template-columns: minmax(5.5em, 36%) minmax(0, 1fr); gap: 8px; white-space: normal !important; overflow-wrap: anywhere; }
  .tbl.stack td::before { content: attr(data-label); font-weight: 700; color: var(--muted); font-size: 0.8rem; }
  .tbl.stack td[data-label=""]::before { content: none; }
  .tbl.stack td[data-label=""] { display: block; }
  .prose { padding: 14px; }
  .steps button { padding: 4px 9px; font-size: 0.8rem; }
}

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side nav { display: none; }
  .side.open nav { display: block; }
  .menu { display: inline-block; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><b>BPL Core Course</b><span>Business-purpose real estate lending · C0-C14</span></div>
    <div class="meter" aria-live="polite">
      <span id="meter-text">0 of 15 modules done</span>
      <div class="bar"><i id="meter-bar"></i></div>
      <span class="sync" id="sync">Loading your progress…</span>
    </div>
    <button class="btn menu" id="menu" aria-expanded="false" aria-controls="side">Show modules</button>
    <nav aria-label="Course">
      <div class="navlabel">Modules</div>
      <ol id="nav-modules"></ol>
      <div class="navlabel" style="margin-top:16px">References</div>
      <ul id="nav-refs"></ul>
    </nav>
  </aside>
  <main id="main"><div class="doc" id="doc"></div></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Reference">
  <header><b id="drawer-title"></b><button class="btn" id="drawer-close">Close</button></header>
  <div class="body prose" id="drawer-body" style="border:0;border-radius:0"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script id="course-data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("course-data").textContent);
const LABEL = "Model policy for training - not for live lending decisions.";
const MODS = DATA.modules;               // [{key, code, title, hours, prereq, draft, md}]
const REFS = DATA.refs;                  // [{key, title, md}]
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const prereqText = (p) => (!p || /^none$/i.test(p.trim())) ? "No prerequisite" : "Prerequisite: " + p;
const hoursText = (h) => `${h} ${h === 1 ? "hour" : "hours"}`;
const PASS = 0.8;

/* ---------- markdown ---------- */
marked.setOptions({ gfm: true, breaks: false });
function decorateTables(box) {
  for (const t of box.querySelectorAll("table")) {
    const w = el("div", "tbl"); t.replaceWith(w); w.appendChild(t);
    const heads = [...t.querySelectorAll("thead th")].map((h) => h.textContent.trim());
    const rows = [...t.querySelectorAll("tbody tr")];
    const ncol = heads.length || (rows[0] ? rows[0].children.length : 0);
    if (ncol >= 3) w.classList.add("stack");
    for (const tr of rows) [...tr.children].forEach((td, i) => { td.dataset.label = heads[i] || ""; });
    for (let c = 0; c < ncol; c++) {
      const cells = rows.map((r) => r.children[c]).filter(Boolean);
      const filled = cells.filter((td) => { const x = td.textContent.trim(); return x && !/^[—–-]$/.test(x); });
      const money = filled.filter((td) => /^[−-]?\$\s?[\d,]/.test(td.textContent.trim()));
      if (filled.length >= 2 && money.length / filled.length >= 0.6) {
        for (const td of cells) td.classList.add("num");
        const th = t.querySelectorAll("thead th")[c]; if (th) th.classList.add("num");
      }
    }
  }
}
function render(md) {
  const html = DOMPurify.sanitize(marked.parse(md));
  const box = document.createElement("div");
  box.innerHTML = html;
  decorateTables(box);
  const used = new Set();
  for (const h of box.querySelectorAll("h2, h3")) {

function buildPractice(sec, qs, saver) {

}

/* ---------- module page: steps ---------- */
const STEPS = [
  { id: "overview", label: "Overview", re: /^(hook|objectives?)/i },
  { id: "learn", label: "Learn", re: /^teach/i },
  { id: "practice", label: "Practice", re: /^practice/i },
  { id: "quiz", label: "Quiz", re: /^quiz/i },
  { id: "ojt", label: "OJT task", re: /^ojt/i },
  { id: "jobaid", label: "Job aid", re: /^job aid/i },
  { id: "wrapup", label: "Wrap-up", re: /^wrap/i },

const stepOf = {};   // page state: last step open per module
function splitSteps(box) {
  const by = Object.fromEntries(STEPS.map((s) => [s.id, []]));
  let target = "overview";
  for (const n of [...box.children]) {
    if (n.tagName === "H2") { const s = STEPS.find((x) => x.re.test(n.textContent.trim())); if (s) target = s.id; }

}
async function showModule(m) {

  const parts = [labelEl(), head];

    parts.push(st);

  notes.innerHTML = `<label for="note-${m.key}">Your notes and OJT write-up</label><p>Saved as you type. Use fictional data only.</p><textarea id="note-${m.key}"></textarea><span class="saved" aria-live="polite"></span>`;
  (steps.find((s) => s.id === "ojt") || steps[steps.length - 1]).sec.append(notes);
  const ta = notes.querySelector("textarea"), saved = notes.querySelector(".saved");
  ta.value = noteText; ta.placeholder = "Your answers, calculations and OJT notes for " + m.code;
  let nt = null, last = ta.value;

  ta.addEventListener("input", () => { clearTimeout(nt); nt = setTimeout(flushN, 900); });

  done.addEventListener("click", () => setStatus(m.key, (state.status[m.key] || "") === "done" ? "in-progress" : "done"));
  row.append(done, el("span", "", "Finished the quiz, the OJT task and the self-check? Mark this module done."));

  const pv = MODS[idx - 1], nx = MODS[idx + 1];
  if (pv) { const a = el("a", "prev"); a.href = "#" + pv.key; a.append(el("span", "dir", "Previous module"), el("b", "", `${pv.code}: ${pv.title}`)); mn.append(a); }

  const bar = el("div", "stepbar"); const barLabel = el("span"); const track = el("div", "bar"); const fill = el("i"); track.append(fill); bar.append(barLabel, track);
  const stage = el("div", "stage");
  const pager = el("div", "pager");
  const back = el("button", "btn", "Back"), nextB = el("button", "btn primary", "Next"); back.type = nextB.type = "button";
  pager.append(back, nextB);
  let cur = Math.min(stepOf[m.key] ?? 0, steps.length - 1);
  const tabBtns = steps.map((s, i) => {
    const li = el("li"); const b = el("button"); b.type = "button"; b.dataset.step = s.id;
    b.append(el("small", "", String(i + 1)), s.label); b.addEventListener("click", () => go(i, true));

  function go(i, scroll) {

    back.textContent = i ? `Back: ${steps[i - 1].label}` : "Back";

function route() {
