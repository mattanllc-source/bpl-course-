name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: excel/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r excel/requirements.txt

      - name: Install LibreOffice (for xlsx recalculation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Formula fixtures match the reference scripts
        run: |
          npm run fixtures
          git diff --exit-code -- formulas/*/tests/fixtures.json

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck && npx tsc -b calculators

      - name: Unit tests (Vitest)
        run: npm test

      - name: Excel tests (pytest + LibreOffice)
        run: npm run test:excel

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
